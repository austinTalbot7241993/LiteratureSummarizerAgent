[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-exploration-agent"
version = "0.1.0"
description = "Literature Exploration Agent (LEA) with Citation Exclusion and Qwen 2.5 7B Summaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.23.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "rapidfuzz>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
    "alembic>=1.11.0",
    "bm25s>=0.1.0",
    "bibtexparser>=1.4.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "sentence-transformers>=2.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
lea = "lea.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
