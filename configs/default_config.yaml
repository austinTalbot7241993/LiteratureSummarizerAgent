application:
  log_level: INFO
  cache_dir: .cache/lea
  artifact_dir: artifacts
  request_timeout_seconds: 30
  max_retries: 4

services:
  database_url: ${LEA_DATABASE_URL:-postgresql://lea_user:lea_pass@localhost:5433/lea_db}
  grobid_url: ${LEA_GROBID_URL:-http://localhost:8070}
  grobid_timeout_seconds: 120.0     # GROBID full-document + consolidation can legitimately take >30s
  openalex_api_key: ${OPENALEX_API_KEY}
  semantic_scholar_api_key: ${SEMANTIC_SCHOLAR_API_KEY:-}
  unpaywall_email: ${UNPAYWALL_EMAIL:-}
  # Rate limiting parameters to prevent HTTP 429 bans
  semantic_scholar_rate_limit_rps: 0.2
  openalex_rate_limit_rps: 5.0

extraction:
  require_complete_bibliography: true
  allow_pymupdf_fallback: true
  allow_openalex_reference_fallback: true
  allow_incomplete_citation_exclusion: false

discovery:
  openalex_limit: 100
  semantic_scholar_limit: 100
  final_candidate_limit: 20
  source_rrf_k: 60
  title_similarity_threshold: 0.96
  year_tolerance: 1

  # Abstract-based relevance screening settings
  screening:
    enabled: true
    method: "llm"                    # Options: "llm", "embedding"
    pre_screening_limit: 50           # Fetch top 50 candidates from APIs for screening
    min_relevance_score: 6.0          # Minimum relevance score (0-10) to pass filter
    max_screened_candidates: null     # Final candidate budget; defaults to discovery.final_candidate_limit when unset
    fallback_on_missing_abstract: pass # Options: "pass" (keep candidate), "drop"

acquisition:
  download_open_access_pdfs: true
  require_downloaded_pdf: true
  max_pdf_bytes: 104857600
  allowed_content_types:
    - application/pdf
  user_agent: "LEA/0.1 scholarly-research-agent"

chunking:
  tokenizer_model: BAAI/bge-m3
  parent_tokens: 768
  parent_overlap_tokens: 96
  child_tokens: 256
  child_overlap_tokens: 48

embedding:
  model: BAAI/bge-m3
  dimension: 1024
  device: auto
  batch_size_gpu: 4
  batch_size_cpu: 1
  normalize_embeddings: true
  max_length: 1024

retrieval:
  dense_top_k: 30
  sparse_top_k: 30
  fused_top_k: 8
  rrf_k: 60
  sparse_backend: bm25s
  scope_sparse_index_per_run: true

llm:
  model: Qwen/Qwen2.5-7B-Instruct
  adapter_path: null
  backend: transformers_peft
  load_in_4bit: true
  quant_type: nf4
  use_double_quant: true
  compute_dtype: float16
  device: cuda
  inference_max_model_length: 2048 # Adjusted for 11GB VRAM headroom
  max_context_tokens: 1800         # Caps context window to prevent CUDA OOM
  max_new_tokens: 600
  temperature: 0.1
  top_p: 0.9
  generation_attempts: 2

  # Self-Critique & Iterative Source Quota Settings
  critique:
    enabled: true
    target_valid_sources: 20            # Loop until exactly 20 valid sources are accepted
    min_relevance_score: 6.0            # Minimum score required for acceptance
    min_grounding_score: 7.0            # Minimum factual grounding score required
    max_search_depth_candidates: 100    # Hard limit on total candidate evaluations
    enable_secondary_graph_expansion: true # Expand to 2nd-degree citations if queue empties

report:
  title: Literature Exploration Report
  include_abstract_only_results: false
  include_retrieval_provenance: true
  include_bibtex: true
